<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>BizTextMaker ログイン</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-container">

        <!-- ロゴ -->
        <div class="logo-area">

            <img
                src="images/txet.png"
                alt="BizTextMaker"
                class="login-logo">

            <div class="logo-text">
                <h1>BizTextMaker</h1>
                <p>ビジネス文書を、もっと簡単に。</p>
            </div>

        </div>

        <!-- ログインフォーム -->
        <form id="loginForm" autocomplete="off">

            <p>
                <label for="userId">ユーザーID</label>
                <input
                    type="text"
                    id="userId"
                    required>
            </p>

            <p>
                <label for="password">パスワード</label>
                <input
                    type="password"
                    id="password"
                    required>
            </p>

            <button
                type="submit"
                id="loginButton"
                class="login-button">
                ログイン
            </button>

        </form>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
